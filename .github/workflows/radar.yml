name: radar-rondas

on:
  schedule:
    - cron: "17 10 * * *"     # every day 10:17 UTC = 07:17 in Brasília
  workflow_dispatch:           # "Run workflow" button for manual runs

permissions:
  contents: write              # commit daily/ and data/
  issues: write                # open the daily issue (GitHub emails it to you)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Scrape
        run: python radar_rondas.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily data
          git diff --cached --quiet || git commit -m "Rondas $(date -u +%F)"
          git push

      - name: Open issue with today's list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="daily/$(date -u +%F).md"
          if [ -f "$f" ] && grep -q '^| \[' "$f"; then
            gh issue create --title "Rondas post-seed $(date -u +%F)" --body-file "$f"
          fi
